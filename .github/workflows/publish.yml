name: Publish to PyPI

# Publishes only for version tags (v*) or an explicit manual dispatch.
# Pushes to main no longer publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a tag (or a manual dispatch on an already-released
          # version) must not fail with "File already exists" from PyPI.
          skip-existing: true
